name: Verify PR & NoCheat Merge Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --upgrade pip "pytest>=8.0"
      - name: Run unit test suite
        run: pytest -q

  nocheat-observe:
    name: NoCheat Merge Gate (observe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --upgrade pip "pytest>=8.0"
      - name: Run NoCheat in shadow observation mode
        uses: espressolee/nocheat-action@21fa1298e07ce5e777af8179b07393021a1d2aac # v0.1.7
        with:
          mode: observe
          python-bin: python
          base-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before || github.sha) }}
          head-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

  nocheat-enforce-warn:
    name: NoCheat Merge Gate (enforce, warn-on-abstain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --upgrade pip "pytest>=8.0"
      - name: Run NoCheat enforce with warn-on-abstain
        uses: espressolee/nocheat-action@21fa1298e07ce5e777af8179b07393021a1d2aac # v0.1.7
        with:
          mode: enforce
          abstain-policy: warn
          python-bin: python
          base-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before || github.sha) }}
          head-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

  nocheat-enforce-strict:
    name: NoCheat Merge Gate (enforce)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --upgrade pip "pytest>=8.0"
      - name: Run NoCheat enforce (Required Status Check)
        uses: espressolee/nocheat-action@21fa1298e07ce5e777af8179b07393021a1d2aac # v0.1.7
        with:
          mode: enforce
          abstain-policy: fail
          python-bin: python
          base-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before || github.sha) }}
          head-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
